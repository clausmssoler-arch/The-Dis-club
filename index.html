<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dis Club</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .content { padding: 30px 20px; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        .gray-btn { background: #999 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💜 The Dis Club</h1>
            <p>Rastreador de Síntomas</p>
        </div>
        <div class="content">
            <div id="loginForm">
                <h2 style="font-size: 20px; margin-bottom: 20px;">Inicia Sesión</h2>
                <div class="form-group">
                    <input type="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Contraseña">
                </div>
                <button onclick="alert('Login en construcción')">Entrar</button>
                <button class="gray-btn" onclick="mostrarRegistro()">Crear Cuenta</button>
            </div>
            
            <div id="registerForm" class="hidden">
                <h2 style="font-size: 20px; margin-bottom: 20px;">Crear Cuenta</h2>
                <div class="form-group">
                    <input type="text" placeholder="Nombre completo">
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Contraseña">
                </div>
                <div class="form-group">
                    <input type="number" placeholder="Edad">
                </div>
                <div class="form-group">
                    <select>
                        <option>Selecciona diagnóstico</option>
                        <option>POTS</option>
                        <option>EDS</option>
                        <option>ME/CFS</option>
                    </select>
                </div>
                <button onclick="alert('Registro en construcción')">Registrarse</button>
                <button class="gray-btn" onclick="mostrarLogin()">Volver</button>
            </div>
        </div>
    </div>

    <script>
        function mostrarLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        }
        
        function mostrarRegistro() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }
    </script>
</body>
</html>
